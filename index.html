<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noordkust Roleplay - Webshop</title>
  <style>
    /* Algemene stijlen */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      line-height: 1.6;
    }

    /* Navigatiebalk & Header */
    header {
      background-color: #1e293b;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #0284c7;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Logo styling */
    .site-logo {
      height: 65px;
      width: auto;
      border-radius: 50%;
      object-fit: contain;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.5);
    }

    .site-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 20px;
    }

    nav a {
      color: #f8fafc;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #38bdf8;
    }

    /* Hoofdcontent */
    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }

    .welcome-card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 15px;
      color: #38bdf8;
    }

    p {
      color: #cbd5e1;
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-container">
      <!-- Logo -->
      <img src="logo.jpg" alt="Noordkust RP Logo" class="site-logo">
      <span class="site-title">Noordkust RP</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="admin.html">Admin</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="welcome-card">
      <h1>Welkom bij Noordkust Roleplay! 🚓</h1>
      <p>
        Een unieke FiveM Roleplay-server waar realistisch roleplay, actie en gezelligheid samenkomen.
        Politie, Ambulance, Auto's, Criminelen & Actieve community.
      </p>
    </div>
  </main>

  <footer>
    &copy; 2026 Noordkust Roleplay. Alle rechten voorbehouden.
  </footer>

</body>
</html>
