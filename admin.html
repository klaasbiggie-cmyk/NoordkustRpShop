<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoordKust RP - Live Admin Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDSgeqJqqf_7NDo2Fi9j4On4k9iWNODczs",
      authDomain: "noordkustrp-7a0bd.firebaseapp.com",
      projectId: "noordkustrp-7a0bd",
      storageBucket: "noordkustrp-7a0bd.firebasestorage.app",
      messagingSenderId: "395759032224",
      appId: "1:395759032224:web:389a9f24s756af091db6c6",
      measurementId: "G-TRXCE8MX4X"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

  <style>
    :root {
      --primary: #00e5ff;
      --secondary: #7000ff;
      --danger: #ff0055;
      --success: #00ff66;
      --card-bg: rgba(15, 18, 26, 0.95);
      --border: rgba(0, 229, 255, 0.25);
      --text: #f0f4f8;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: #07090e; color: var(--text); min-height: 100vh; }

    #lock-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 6, 10, 0.98); display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .login-box {
      background: var(--card-bg); border: 2px solid var(--primary);
      padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center;
    }

    .dashboard { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; background: rgba(10, 12, 18, 0.98); border-right: 1px solid var(--border);
      padding: 25px; display: flex; flex-direction: column; gap: 10px;
    }
    .sidebar h2 { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; color: var(--primary); margin-bottom: 25px; }

    .nav-item {
      padding: 12px 15px; border-radius: 10px; color: var(--text-muted); cursor: pointer;
      font-weight: 600; display: flex; align-items: center; gap: 12px; transition: 0.3s;
    }
    .nav-item:hover, .nav-item.active { background: rgba(0, 229, 255, 0.1); color: var(--primary); border: 1px solid var(--border); }

    .content-area { flex: 1; padding: 30px; }
    .panel-section { display: none; }
    .panel-section.active { display: block; }

    .panel-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 16px; padding: 25px; margin-bottom: 20px;
    }
    .input-field {
      width: 100%; padding: 12px 15px; margin-bottom: 15px;
      background: #0a0c10; border: 1px solid var(--border); border-radius: 8px; color: #fff; outline: none;
    }
    .btn {
      padding: 10px 20px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
      background: linear-gradient(135deg, var(--secondary), var(--primary)); color: #fff;
    }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); color: #000; }

    .item-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #0a0c10; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- Inlogscherm -->
  <div id="lock-screen">
    <div class="login-box">
      <h2 style="font-family:'Orbitron'; color:var(--primary); margin-bottom:15px;">STAFF LOGIN</h2>
      <form onsubmit="login(event)">
        <input type="text" id="user" class="input-field" placeholder="Gebruikersnaam" required>
        <input type="password" id="pass" class="input-field" placeholder="Wachtwoord" required>
        <button type="submit" class="btn" style="width:100%;">Inloggen</button>
      </form>
    </div>
  </div>

  <div class="dashboard">
    <div class="sidebar">
      <h2>NOORDKUST <span style="color:#fff;">RP</span></h2>
      <div class="nav-item active" onclick="switchTab('tab-overview', this)"><i class="fa-solid fa-chart-pie"></i> Server Control</div>
      <div class="nav-item" onclick="switchTab('tab-staff', this)"><i class="fa-solid fa-users-gear"></i> Staff Beheer</div>
      <button class="btn btn-danger" style="margin-top:auto;" onclick="location.reload()">Uitloggen</button>
    </div>

    <div class="content-area">
      
      <!-- TAB 1: SERVER CONTROL -->
      <div id="tab-overview" class="panel-section active">
        <h1 style="font-family: 'Orbitron'; margin-bottom: 20px;">Live Website Aansturen</h1>
        
        <div class="panel-card">
          <h3><i class="fa-solid fa-power-off"></i> Live Server Status & Spelers</h3>
          <p style="color:var(--text-muted); margin-bottom:15px;">Kies de status die live getoond wordt op de hoofdwebsite:</p>
          <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button class="btn btn-success" onclick="updateServerStatus(true)">Zet Server ONLINE</button>
            <button class="btn btn-danger" onclick="updateServerStatus(false)">Zet Server OFFLINE</button>
          </div>
          <input type="number" id="player-count" class="input-field" placeholder="Aantal spelers online (bijv. 45)" style="max-width:300px;">
          <button class="btn" onclick="updatePlayerCount()">Aantal Spelers Updaten</button>
        </div>

        <div class="panel-card">
          <h3><i class="fa-solid fa-pen"></i> Welkomsttekst Aanpassen</h3>
          <textarea id="hero-text-input" class="input-field" rows="3" placeholder="Typ hier de nieuwe welkomsttekst voor de hoofdpagina..."></textarea>
          <button class="btn" onclick="updateHeroText()">Tekst Live Updaten</button>
        </div>
      </div>

      <!-- TAB 2: STAFF BEHEER -->
      <div id="tab-staff" class="panel-section">
        <h1 style="font-family: 'Orbitron'; margin-bottom: 20px;">Staff Team Beheren</h1>
        
        <div class="panel-card">
          <h3><i class="fa-solid fa-user-plus"></i> Stafflid Toevoegen</h3>
          <form onsubmit="addStaff(event)">
            <input type="text" id="staff-name" class="input-field" placeholder="Naam / Discord ID" required>
            <input type="text" id="staff-role" class="input-field" placeholder="Rol (bijv. Developer, Admin)" required>
            <button type="submit" class="btn">Toevoegen aan Website</button>
          </form>
        </div>

        <div class="panel-card">
          <h3><i class="fa-solid fa-users"></i> Actief Staff Team op Hoofdpagina</h3>
          <div id="admin-list"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    function login(e) {
      e.preventDefault();
      if (document.getElementById('user').value === 'admin' && document.getElementById('pass').value === 'admin123') {
        document.getElementById('lock-screen').style.display = 'none';
        loadStaffList();
      } else {
        alert('Onjuiste gegevens!');
      }
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.panel-section').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      el.classList.add('active');
    }

    function updateServerStatus(online) {
      db.collection("settings").doc("server").set({ online: online }, { merge: true });
      alert("Server status direct bijgewerkt op de website!");
    }

    function updatePlayerCount() {
      const count = document.getElementById("player-count").value;
      db.collection("settings").doc("server").set({ players: count }, { merge: true });
      alert("Spelersaantal bijgewerkt!");
    }

    function updateHeroText() {
      const text = document.getElementById("hero-text-input").value;
      db.collection("settings").doc("server").set({ heroText: text }, { merge: true });
      alert("Hoofdtekst live gewijzigd!");
    }

    function addStaff(e) {
      e.preventDefault();
      const name = document.getElementById("staff-name").value;
      const role = document.getElementById("staff-role").value;

      db.collection("staff").add({ name, role }).then(() => {
        alert("Stafflid toegevoegd aan de website!");
        e.target.reset();
      });
    }

    function removeStaff(id) {
      db.collection("staff").doc(id).delete().then(() => alert("Stafflid verwijderd!"));
    }

    function loadStaffList() {
      db.collection("staff").onSnapshot((snapshot) => {
        const list = document.getElementById("admin-list");
        list.innerHTML = "";
        snapshot.forEach((doc) => {
          const s = doc.data();
          list.innerHTML += `
            <div class="item-row">
              <span><strong>${s.name}</strong> (${s.role})</span>
              <button class="btn btn-danger" style="padding:4px 8px; font-size:0.8rem;" onclick="removeStaff('${doc.id}')">Verwijder</button>
            </div>
          `;
        });
      });
    }
  </script>
</body>
</html>
